name: Attendly scheduled tasks

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
      timezone: 'Asia/Kolkata'

concurrency:
  group: attendly-scheduled-tasks
  cancel-in-progress: false

jobs:
  run-management-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_CRON_URL: ${{ secrets.BACKEND_CRON_URL }}
      SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run backend scheduled tasks
        shell: bash
        run: |
          test -n "$BACKEND_CRON_URL"
          test -n "$SCHEDULER_SECRET"
          curl --fail-with-body --show-error --silent --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 15 --max-time 60 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-Scheduler-Secret: $SCHEDULER_SECRET" \
            "$BACKEND_CRON_URL"

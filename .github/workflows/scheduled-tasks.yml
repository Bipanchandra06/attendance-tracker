name: Attendly scheduled tasks

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
      timezone: 'Asia/Kolkata'

concurrency:
  group: attendly-scheduled-tasks
  cancel-in-progress: false

jobs:
  run-management-commands:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: website.settings
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG: 'False'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOWED_HOSTS: localhost
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      TIME_ZONE: Asia/Kolkata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Finalize attendance
        run: python backend/manage.py finalize_attendance
      - name: Send reminders
        run: python backend/manage.py send_reminders
